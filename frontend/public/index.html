<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        />
        <meta name="theme-color" content="#000000" />

        <title>RESXPECT — The trust layer for independent work</title>

        <meta
            name="description"
            content="Protected digital agreements that connect payment, evidence, outcomes and reputation."
        />

        <!-- WhatsApp, LinkedIn and Facebook preview -->
        <meta property="og:type" content="website" />
        <meta
            property="og:title"
            content="RESXPECT — The trust layer for independent work"
        />
        <meta
            property="og:description"
            content="More than a handshake."
        />
        <meta
            property="og:url"
            content="https://venerable-cendol-7d5fc6.netlify.app/"
        />
        <meta
            property="og:image"
            content="https://venerable-cendol-7d5fc6.netlify.app/assets/resxpect-share.png"
        />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="RESXPECT logo"
        />

        <!-- X / Twitter preview -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta
            name="twitter:title"
            content="RESXPECT — The trust layer for independent work"
        />
        <meta
            name="twitter:description"
            content="Protected digital agreements that connect payment, evidence, outcomes and reputation."
        />
        <meta
            name="twitter:image"
            content="https://venerable-cendol-7d5fc6.netlify.app/assets/resxpect-share.png"
        />

        <!-- Favicon -->
        <link
            rel="icon"
            type="image/png"
            href="%PUBLIC_URL%/assets/resxpect-share.png"
        />
        <link
            rel="apple-touch-icon"
            href="%PUBLIC_URL%/assets/resxpect-share.png"
        />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
    </head>

    <body>
        <noscript>
            You need to enable JavaScript to run this app.
        </noscript>

        <div id="root"></div>
